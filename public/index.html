<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resort Oceanami</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <section id="login" class="card">
      <h1>Resort Oceanami</h1>
      <p>Đăng nhập hệ thống quản lý</p>
      <input id="username" placeholder="Tài khoản hoặc mã villa" autocomplete="username">
      <input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password">
      <button id="loginBtn" class="primary-btn">Đăng nhập</button>
      <p id="loginError" class="error"></p>
    </section>

    <section id="resident" class="hidden">
      <header class="page-header"><h2 id="welcome">Xin chào</h2><button id="logout">Đăng xuất</button></header>
      <div id="residentContent" class="card"></div>
    </section>

    <section id="admin" class="hidden">
      <header class="page-header"><h2>Quản trị Oceanami</h2><button id="logoutAdmin">Đăng xuất</button></header>
      <div class="stats-grid"><div class="stat-card">Villa <strong id="villaCount">0</strong></div><div class="stat-card">Hóa đơn <strong id="invoiceCount">0</strong></div></div>
      <div id="adminContent" class="card"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
